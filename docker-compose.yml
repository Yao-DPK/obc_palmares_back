services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: palmares
      POSTGRES_USER: palmares
      POSTGRES_PASSWORD: palmares
    ports:
      - "5422:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mail:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"

volumes:
  pgdata: